# GradIntel: three services only.
#   db        PostgreSQL + pgvector (localhost only, not public)
#   backend   FastAPI (private, reached through the frontend proxy)
#   frontend  Caddy: serves the React app, proxies /api and /docs to the
#             backend, and gets an HTTPS certificate for ${DOMAIN} automatically.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
    # Bound to localhost only: reachable from the machine itself, never the internet
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build:
      context: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
        restart: true
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      - FRONTEND_HOST=https://${DOMAIN?Variable not set}
    # Wait for the DB, run migrations, create the first superuser, then serve.
    command: bash -c "bash scripts/prestart.sh && fastapi run --workers 4 app/main.py"
    # Lets the backend reach Ollama running on the host machine (Linux needs this).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    restart: always
    depends_on:
      - backend
    environment:
      - DOMAIN=${DOMAIN?Variable not set}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-db-data:
  caddy-data:
  caddy-config:
